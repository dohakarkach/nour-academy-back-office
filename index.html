<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NourAdmin | Tableau de bord</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="./js/app.js" defer></script>
  </head>

  <body>
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <rect x="4" y="5" width="5" height="22" rx="2.5" />
            <rect x="13.5" y="12" width="5" height="15" rx="2.5" />
            <rect x="23" y="3" width="5" height="24" rx="2.5" />
          </svg>
        </div>

        <div class="brand-text">
          <strong>Nour Academy</strong>
          <span>Administration</span>
        </div>

        <button class="collapse-button menu-button" id="mobile-button">
          <svg
            xmlns="http://w3.org"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
      </div>

      <nav class="docs-nav" aria-label="Navigation principale">
        <div class="nav-group">
          <a href="#tableau-de-bord" class="selected" aria-current="page">
            Tableau de bord
          </a>
          <div class="decoration-line" aria-hidden="true"></div>
          <a href="#inscriptions">Inscriptions</a>
          <div class="decoration-line" aria-hidden="true"></div>
          <a href="#parametres">Paramètres</a>
        </div>
      </nav>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button
          class="menu-button"
          id="menuButton"
          type="button"
          aria-label="Ouvrir ou fermer le menu"
          aria-controls="sidebar"
          aria-expanded="true"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <label class="command-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="7.2" />
            <path d="m16.2 16.2 4.3 4.3" />
          </svg>

          <input
            type="search"
            id="globalSearch"
            placeholder="Rechercher une inscription..."
            aria-label="Rechercher une inscription"
          />
        </label>
      </header>

      <section class="page-content" id="pageContent">
        <!-- <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Numéro de dossier</th>
                <th>Élève</th>
                <th>Niveau</th>
                <th>Cours</th>
                <th>Téléphone du parent</th>
                <th>Statut</th>
                <th>Date</th>
              </tr>
            </thead>

            <tbody id="inscriptions-body">
              Les inscriptions seront ajoutées par JavaScript
            </tbody>
          </table>
        </div> -->
      </section>
    </main>
  </body>
</html>
